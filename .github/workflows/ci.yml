name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" "ndk;29.0.14206865"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Test, lint, and assemble
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test lint assembleDebug assembleRelease \
            :ffmpeg-sdk-core:generatePomFileForMavenPublication \
            :ffmpeg-sdk-android:generatePomFileForReleasePublication \
            :ffmpeg-sdk-engine-ffmpegkit:generatePomFileForReleasePublication

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-build
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/outputs/**/*.aar
            sample-app/build/outputs/apk/debug/*.apk
